<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>🔬 Research Notebook</h1>
      <p>Your experiments, your layout. Saved in this browser.</p>
    </div>
    <button id="customizeBtn" class="ghost">⚙ Customize</button>
  </header>

  <aside id="panel" hidden>
    <h2>Customize dashboard</h2>

    <h3>Widgets <small>(toggle, reorder, resize)</small></h3>
    <ul id="widgetConfig"></ul>

    <h3>Appearance</h3>
    <label>Accent color <input type="color" id="accent"></label>
    <label>Theme
      <select id="theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <label>Columns
      <select id="columns">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>
    <label>Dashboard title <input id="dashTitle" maxlength="40"></label>

    <button id="resetBtn" class="danger">Reset to defaults</button>
    <button id="closePanel">Done</button>
  </aside>

  <main>
    <h2 id="dashHeading"></h2>
    <section id="dashboard"></section>

    <h2>Experiments</h2>
    <form id="form">
      <input id="title" placeholder="Experiment title" required>
      <input id="hypothesis" placeholder="Hypothesis">
      <select id="status">
        <option>Planned</option>
        <option>Running</option>
        <option>Completed</option>
      </select>
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
